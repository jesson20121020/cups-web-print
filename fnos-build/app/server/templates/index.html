<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web打印服务</title>
    <link rel="icon" href="static/favicon.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 打印预览模块（移植自 hanxi/cups-web 的 PrintPreview.vue + PdfCanvas.vue 思路） -->
    <script src="/static/print-preview.js"></script>
    <style>
        .upload-area {
            border: 2px dashed #cbd5e1;
            transition: all 0.3s ease;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        /* 主布局容器 - 桌面端两栏（主区 + 窄侧栏），手机端单列 */
        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        @media (min-width: 1024px) {
            .main-layout {
                flex-direction: row;
                align-items: flex-start;
                gap: 0.75rem;
            }
            .layout-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.75rem; }
            .layout-side { width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 0.75rem; }
        }
        /* 折叠面板样式 */
        details.section-collapse {
            background: white;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        details.section-collapse > summary {
            list-style: none;
            cursor: pointer;
            padding: 0.75rem 1rem;
            font-weight: 600;
            color: #1f2937;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
            border-radius: 0.75rem;
            transition: background-color 0.15s;
        }
        details.section-collapse > summary:hover {
            background-color: #f9fafb;
        }
        details.section-collapse > summary::-webkit-details-marker {
            display: none;
        }
        details.section-collapse > summary::after {
            content: '▸';
            color: #6b7280;
            font-size: 0.875rem;
            transition: transform 0.15s;
        }
        details.section-collapse[open] > summary::after {
            transform: rotate(90deg);
        }
        .section-body {
            padding: 0.25rem 1rem 1rem;
        }
        /* 手机端：详细打印设置默认折叠；桌面端默认展开 */
        @media (max-width: 1023px) {
            details#advancedSettings { /* 默认折叠（无 open 属性） */ }
        }
        /* 核心控件（打印机/纸张/打印按钮）样式强调 */
        .core-controls {
            background: white;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            padding: 1rem 1.25rem;
        }
        /* 图片预览容器 */
        .image-preview-container {
            scroll-behavior: smooth;
        }
        
        /* 页面图片样式 */
        .page-image {
            max-height: 500px;
            object-fit: contain;
            transition: transform 0.2s ease;
        }
        
        .page-image:hover {
            transform: scale(1.02);
            cursor: pointer;
        }

    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2 flex items-center justify-center gap-3">
                <svg class="w-9 h-9 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 9V3h12v6M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v7H6z"/>
                </svg>
                Web打印服务
            </h1>
            <p class="text-gray-600">基于CUPS的网络打印解决方案</p>
        </header>

        <div class="main-layout">
            <div class="layout-main">
            <!-- 1. 打印预览卡片（永远展开）：未选文件时是上传入口，已选文件时是预览+右上角删除 -->
            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex justify-between items-center mb-4 gap-2 flex-wrap">
                    <h2 class="text-xl font-semibold text-gray-800 flex items-center gap-2">
                        <svg class="w-6 h-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-2a2 2 0 00-2-2H5a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2zM21 12V7a2 2 0 00-2-2h-7m-3 7l3 3m0 0l3-3m-3 3V4"/>
                        </svg>
                        打印预览
                    </h2>
                    <div class="flex items-center gap-2">
                        <div class="flex rounded-md border border-gray-300 overflow-hidden text-xs">
                            <button type="button" id="orientPortraitBtn" class="px-2 py-1 hover:bg-gray-100 bg-blue-500 text-white" title="纵向">纵向</button>
                            <button type="button" id="orientLandscapeBtn" class="px-2 py-1 hover:bg-gray-100" title="横向">横向</button>
                        </div>
                    </div>
                </div>

                <!-- 预览/上传 区域（用 div 包裹，按 JS 逻辑区分行为：未选文件=触发上传，已选文件=纯预览） -->
                <div id="uploadPreviewContainer" class="upload-area block rounded-lg overflow-hidden relative cursor-pointer" style="min-height: 180px;">
                    <!-- 未选文件：上传入口 -->
                    <div id="uploadState" class="flex flex-col items-center justify-center p-6 text-center">
                        <svg class="h-14 w-14 text-gray-300 mb-3" fill="none" viewBox="0 0 48 48" stroke="currentColor">
                            <path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02"/>
                        </svg>
                        <p class="text-base font-medium text-gray-600 mb-1">点击或拖拽文件到此处上传</p>
                        <p class="text-xs text-gray-400 mb-3">支持 PDF、Word、图片等格式 (最大 100MB)</p>
                        <span class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg cursor-pointer inline-block">选择文件</span>
                    </div>

                    <!-- 已选文件：文件名 + 大小 + 实时预览 -->
                    <div id="selectedFileInfo" class="hidden p-4">
                        <div class="flex items-center gap-3 mb-3">
                            <div id="selectedFileIcon" class="w-10 h-10 flex-shrink-0 flex items-center justify-center bg-blue-50 text-blue-500 rounded">
                                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                                </svg>
                            </div>
                            <div class="min-w-0 flex-1">
                                <p id="selectedFileName" class="text-sm font-medium text-gray-800 break-all"></p>
                                <p id="selectedFileSize" class="text-xs text-gray-400 mt-0.5"></p>
                            </div>
                            <button id="removeFile" title="移除当前文件" class="hidden flex-shrink-0 bg-red-500 hover:bg-red-600 text-white text-xs px-3 py-1.5 rounded transition flex items-center gap-1" aria-label="移除文件">
                                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                                </svg>
                                删除
                            </button>
                        </div>
                        <p class="text-xs text-gray-500 mb-2" id="previewPaperLabel">A4 (210×297mm)</p>
                        <div id="printPreviewContainer"></div>
                        <p class="text-xs text-gray-400 mt-2 text-center">预览基于当前纸张与方向，可随时切换查看效果</p>
                    </div>

                    <!-- 上传进度 -->
                    <div id="uploadProgress" class="absolute inset-0 flex flex-col items-center justify-center p-4 bg-white/90" style="display: none; z-index: 10;">
                        <div class="w-full max-w-xs">
                            <div class="flex items-center justify-between text-sm text-gray-600 mb-2">
                                <span id="progressText">正在上传...</span>
                                <span id="progressPercent">0%</span>
                            </div>
                            <div class="bg-gray-200 rounded-full h-2.5 overflow-hidden">
                                <div id="progressBar" class="bg-blue-500 h-2.5 rounded-full transition-all duration-300 ease-out" style="width: 0%"></div>
                            </div>
                            <button id="cancelUploadBtn" class="mt-3 w-full bg-red-500 hover:bg-red-600 text-white text-sm py-1.5 rounded transition">取消上传</button>
                        </div>
                    </div>

                    <input type="file" id="fileInput" style="display:none;">
                </div>
            </div>

            <!-- 2. 核心控件：打印机 + 纸张 + 打印按钮（永远展开） -->
            <div class="core-controls">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
                    <div class="md:col-span-1">
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">打印机</label>
                        <select id="printerSelect" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                            <option value="">加载中...</option>
                        </select>
                    </div>
                    <div class="md:col-span-1">
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">纸张大小</label>
                        <select id="paperSize" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                            <option value="A4" selected>A4 (21.0×29.7cm)</option>
                            <option value="A3">A3 (29.7×42.0cm)</option>
                            <option value="A2">A2 (42.0×59.4cm)</option>
                            <option value="A1">A1 (59.4×84.1cm)</option>
                            <option value="A5">A5 (14.8×21.0cm)</option>
                            <option value="A6">A6 (10.5×14.8cm)</option>
                            <option value="B4">B4 (25.0×35.3cm)</option>
                            <option value="B5">B5 (17.6×25.0cm)</option>
                            <option value="3.5x5">3.5×5 英寸 (8.9×12.7cm)</option>
                            <option value="4x6">4×6 英寸 (10.2×15.2cm)</option>
                            <option value="5x7">5×7 英寸 (12.7×17.8cm)</option>
                            <option value="8x10">8×10 英寸 (20.3×25.4cm)</option>
                        </select>
                    </div>
                    <div class="md:col-span-1 flex items-end">
                        <button id="printBtn" disabled class="w-full bg-blue-500 hover:bg-blue-600 disabled:bg-gray-400 text-white font-semibold py-2.5 rounded-lg flex items-center justify-center gap-2 text-sm">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 9V3h12v6M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v7H6z"/>
                            </svg>
                            提交打印
                        </button>
                    </div>
                </div>

                <div id="printParamsSection" class="hidden">
                    <h3 class="text-sm font-semibold text-gray-800 mb-2 flex items-center">
                        <svg class="w-4 h-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
                        </svg>
                        打印参数详情
                    </h3>
                    <div id="printParamsContent" class="bg-blue-50 border border-blue-200 rounded-lg p-3 text-xs"></div>
                </div>
            </div>

            <!-- 3. 详细打印设置（桌面默认展开 / 手机默认折叠） -->
            <details class="section-collapse" id="advancedSettings">
                <summary>
                    <span class="flex items-center gap-2">
                        <svg class="w-5 h-5 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                        详细打印设置
                    </span>
                </summary>
                <div class="section-body">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">纸张材质</label>
                            <select id="paperType" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                                <option value="plain" selected>普通纸</option>
                                <option value="photo">照片纸</option>
                                <option value="glossy">光面照片纸</option>
                                <option value="matte">哑光照片纸</option>
                                <option value="envelope">信封</option>
                                <option value="cardstock">卡片纸</option>
                                <option value="labels">标签纸</option>
                                <option value="auto">自动选择</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">色彩模式</label>
                            <div class="flex gap-2">
                                <label class="flex-1 flex items-center justify-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer transition">
                                    <input type="radio" name="colorMode" value="color" checked class="mr-2">
                                    <svg class="w-5 h-5 mr-1 text-blue-500" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10" fill="red"/><circle cx="6" cy="18" r="10" fill="green"/><circle cx="18" cy="18" r="10" fill="blue"/></svg>
                                    <span class="text-sm">彩色</span>
                                </label>
                                <label class="flex-1 flex items-center justify-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer transition">
                                    <input type="radio" name="colorMode" value="mono" class="mr-2">
                                    <svg class="w-5 h-5 mr-1 text-gray-700" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
                                    <span class="text-sm">黑白</span>
                                </label>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">双面打印</label>
                            <div class="space-y-1.5">
                                <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer transition text-sm">
                                    <input type="radio" name="duplex" value="one-sided" class="mr-2">
                                    <span>单面</span>
                                </label>
                                <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer transition text-sm">
                                    <input type="radio" name="duplex" value="two-sided-long-edge" checked class="mr-2">
                                    <span>双面(长边翻页)</span>
                                </label>
                                <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer transition text-sm">
                                    <input type="radio" name="duplex" value="two-sided-short-edge" class="mr-2">
                                    <span>双面(短边翻页)</span>
                                </label>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">打印方向</label>
                            <div class="flex gap-2">
                                <label class="flex-1 flex items-center justify-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer transition">
                                    <input type="radio" name="orientation" value="portrait" checked class="mr-2">
                                    <span class="text-sm">纵向</span>
                                </label>
                                <label class="flex-1 flex items-center justify-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer transition">
                                    <input type="radio" name="orientation" value="landscape" class="mr-2">
                                    <span class="text-sm">横向</span>
                                </label>
                            </div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5 mt-3">打印份数</label>
                            <input type="number" id="copies" value="1" min="1" max="99" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">镜像打印</label>
                            <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer transition text-sm">
                                <input type="checkbox" id="mirrorPrint" class="mr-2">
                                <span>水平翻转</span>
                            </label>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">打印缩放</label>
                            <select id="printScaling" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                                <option value="auto">自动</option>
                                <option value="auto-fit">自动适应</option>
                                <option value="fit" selected>适应纸张</option>
                                <option value="fill">填充纸张</option>
                                <option value="none">无缩放</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">
                            页面范围
                            <span id="pageRangeError" class="text-red-500 text-xs ml-2 hidden">格式无效</span>
                        </label>
                        <input type="text" id="pageRange" placeholder="例如：1-5 8 10-12"
                               pattern="^(\d+(-\d+)?)(\s+\d+(-\d+)?)*$"
                               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:border-green-500 focus:ring-1 focus:ring-green-500"
                               oninput="validatePageRange(this.value)">
                        <p class="text-xs text-gray-500 mt-1">支持格式：1-5 8 10-12（空格分隔，不支持逗号）</p>
                    </div>
                </div>
            </details>

            <!-- 4. 已上传文件（默认折叠） -->
            </div>
            <div class="layout-side">
            <details class="section-collapse">
                <summary>
                    <span class="flex items-center gap-2">
                        <svg class="w-5 h-5 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
                        </svg>
                        已上传文件
                    </span>
                    <button id="refreshFiles" class="text-xs text-blue-500 hover:text-blue-700" onclick="event.stopPropagation()">刷新</button>
                </summary>
                <div class="section-body">
                    <div id="filesList" class="space-y-2 max-h-60 overflow-y-auto">
                        <p class="text-gray-500 text-xs text-center py-2">加载中...</p>
                    </div>
                </div>
            </details>

            <!-- 5. 已提交任务 + 打印机信息（默认折叠） -->
            <details class="section-collapse">
                <summary>
                    <span class="flex items-center gap-2">
                        <svg class="w-5 h-5 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
                        </svg>
                        已提交任务与打印机信息
                    </span>
                    <button id="refreshQueue" class="text-xs text-blue-500 hover:text-blue-700" onclick="event.stopPropagation()">刷新</button>
                </summary>
                <div class="section-body">
                    <!-- 批量操作工具栏 -->
                    <div id="jobsToolbar" class="hidden flex justify-end gap-2 mb-2 pb-2 border-b border-gray-100">
                        <button id="cancelAllJobsBtn" onclick="event.stopPropagation(); cancelAllJobs();"
                                class="text-xs bg-orange-500 hover:bg-orange-600 text-white px-3 py-1 rounded transition flex items-center gap-1"
                                title="取消所有可取消的任务">
                            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                            </svg>
                            全部取消
                        </button>
                        <button id="deleteAllJobsBtn" onclick="event.stopPropagation(); deleteAllJobs();"
                                class="text-xs bg-gray-500 hover:bg-gray-600 text-white px-3 py-1 rounded transition flex items-center gap-1"
                                title="删除所有已完成/失败的任务记录">
                            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M1 10h22"/>
                            </svg>
                            全部删除
                        </button>
                    </div>
                    <div id="jobsList" class="space-y-2 max-h-60 overflow-y-auto">

    <div id="toast" class="fixed bottom-4 right-4 bg-gray-800 text-white px-6 py-3 rounded-lg hidden"></div>

    <script>
        const UPLOAD_LIMIT = {{ max_upload_size }};
        const ALLOWED_EXTENSIONS = {{ allowed_extensions | tojson }};

        // HTML 转义工具函数，防止 XSS（所有外部数据插值必须经过此函数）
        function escapeHtml(value) {
            if (value === null || value === undefined) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
        let uploadedFile = null;
        let currentUploadXhr = null;
        let jobs = [];
        let jobsTimerId = null;
        let filesTimerId = null;

        // 页面范围验证函数
        function validatePageRange(value) {
            const errorSpan = document.getElementById('pageRangeError');
            const input = document.getElementById('pageRange');

            // 空值有效（打印全部）
            if (!value || value.trim() === '') {
                if (errorSpan) errorSpan.classList.add('hidden');
                if (input) {
                    input.classList.remove('border-red-500', 'border-green-500');
                    input.classList.add('border-gray-300');
                }
                return true;
            }

            // 检查是否包含逗号（不支持逗号分隔）
            if (value.includes(',')) {
                if (errorSpan) {
                    errorSpan.textContent = '不支持逗号分隔，请使用空格分隔（如：1-5 8 10-12）';
                    errorSpan.classList.remove('hidden');
                }
                if (input) {
                    input.classList.remove('border-gray-300', 'border-green-500');
                    input.classList.add('border-red-500');
                }
                return false;
            }

            // 验证格式：1, 1-5, 1-5 8, 1-5 8 10-12（空格分隔）
            const pattern = /^(\d+(-\d+)?)(\s+\d+(-\d+)?)*$/;
            const isValid = pattern.test(value);

            if (errorSpan) {
                if (isValid) {
                    errorSpan.textContent = '格式无效';
                    errorSpan.classList.add('hidden');
                    if (input) {
                        input.classList.remove('border-red-500');
                        input.classList.add('border-green-500');
                    }
                } else {
                    errorSpan.textContent = '格式无效';
                    errorSpan.classList.remove('hidden');
                    if (input) {
                        input.classList.remove('border-gray-300', 'border-green-500');
                        input.classList.add('border-red-500');
                    }
                }
            }

            return isValid;
        }


        document.addEventListener('DOMContentLoaded', () => {
            // 响应式默认展开/折叠：详细打印设置
            // 桌面端（≥1024px）默认展开，手机端默认折叠；用户手动改后不再覆盖
            const advSettings = document.getElementById('advancedSettings');
            if (advSettings) {
                const isDesktop = window.matchMedia('(min-width: 1024px)').matches;
                advSettings.open = isDesktop;
            }

            // 获取DOM元素
            const uploadPreviewContainer = document.getElementById('uploadPreviewContainer');
            const uploadState = document.getElementById('uploadState');
            const selectedFileInfo = document.getElementById('selectedFileInfo');
            const fileInput = document.getElementById('fileInput');
            const removeFileBtn = document.getElementById('removeFile');
            const printBtn = document.getElementById('printBtn');
            const refreshFilesBtn = document.getElementById('refreshFiles');
            const refreshQueueBtn = document.getElementById('refreshQueue');

            // 文件上传事件
            if (fileInput) {
                fileInput.addEventListener('change', (e) => {
                    if (e.target.files.length > 0) {
                        handleFile(e.target.files[0]);
                    }
                });
            }

            // 为label元素添加点击事件，防止事件冒泡
            const labelElement = uploadState?.querySelector('label');
            if (labelElement) {
                labelElement.addEventListener('click', (e) => {
                    // label会自动触发fileInput的click()，这里只需要阻止冒泡
                    e.stopPropagation();
                });
            }

            // 点击上传区域触发文件选择（避免重复触发）
            if (uploadState) {
                uploadState.addEventListener('click', (e) => {
                    if (fileInput) {
                        fileInput.click();
                    }
                });
            }

            // 拖拽事件
            if (uploadPreviewContainer) {
                uploadPreviewContainer.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    uploadPreviewContainer.classList.add('dragover');
                });
                uploadPreviewContainer.addEventListener('dragleave', () => {
                    uploadPreviewContainer.classList.remove('dragover');
                });
                uploadPreviewContainer.addEventListener('drop', (e) => {
                    e.preventDefault();
                    uploadPreviewContainer.classList.remove('dragover');
                    if (e.dataTransfer.files.length > 0) {
                        handleFile(e.dataTransfer.files[0]);
                    }
                });
            }

            // 文件列表按钮事件委托
            const filesList = document.getElementById('filesList');
            if (filesList) {
                filesList.addEventListener('click', (e) => {
                    const btn = e.target.closest('button[data-action]');
                    if (!btn) return;
                    const filename = decodeURIComponent(btn.dataset.filename);
                    if (btn.dataset.action === 'select') selectFile(filename);
                    if (btn.dataset.action === 'delete') deleteFile(filename);
                });
            }

            // 移除文件
            if (removeFileBtn) {
                removeFileBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    uploadedFile = null;
                    if (fileInput) fileInput.value = '';
                    if (uploadState) uploadState.classList.remove('hidden');
                    if (selectedFileInfo) {
                        selectedFileInfo.classList.add('hidden');
                        selectedFileInfo.classList.remove('flex', 'flex-col');
                    }
                    removeFileBtn.classList.add('hidden');
                    // 同步清空实时预览（右侧 PDF.js）
                    if (window.__printPreview) {
                        window.__printPreview.cleanupPdfDoc();
                        window.__printPreview.currentToken = null;
                        const emptyEl = window.__printPreview.container.querySelector('.preview-empty');
                        if (emptyEl) emptyEl.classList.remove('hidden');
                    }
                    updatePrintButton();
                });
            }

            // 打印按钮
            if (printBtn) {
                printBtn.addEventListener('click', handlePrint);
            }

            // 刷新按钮
            if (refreshFilesBtn) {
                refreshFilesBtn.addEventListener('click', loadFiles);
            }
            if (refreshQueueBtn) {
                refreshQueueBtn.addEventListener('click', () => {
                    loadJobs();
                    updatePrinterInfoDisplay();
                });
            }

            // 打印机信息刷新定时器 ID
            let printerInfoTimerId = null;

            // 重置打印机信息刷新定时器
            function resetPrinterInfoTimer() {
                if (printerInfoTimerId) {
                    clearInterval(printerInfoTimerId);
                }
                printerInfoTimerId = setInterval(() => {
                    try {
                        updatePrinterInfoDisplay();
                    } catch (e) {
                        console.error('定时加载打印机信息失败:', e);
                    }
                }, 5000);  // 5秒（从11秒加快）— 打印机卡纸/缺纸等错误需快速响应
                console.log('打印机信息定时器已重置');
            }

            // 打印机选择变化
            const printerSelect = document.getElementById('printerSelect');
            if (printerSelect) {
                printerSelect.addEventListener('change', () => {
                    // 切换打印机时更新所有信息
                    updatePrinterInfoDisplay();
                    // 重置定时器，避免短时间内重复请求
                    resetPrinterInfoTimer();
                });
            }

            // 初始化
            (async () => {
                // 等待打印机列表加载完成
                await loadPrinters();
                await loadJobs();
                await loadFiles();

                // 延迟加载打印机信息，确保打印机已选择
                setTimeout(async () => {
                    console.log('开始加载打印机信息...');
                    await updatePrinterInfoDisplay();
                    console.log('打印机信息加载完成');
                    // 启动定时器
                    resetPrinterInfoTimer();
                }, 1000);
            })();

            // ===== 实时打印预览（移植自 hanxi/cups-web） =====
            // 自定义一个虚拟的 orientSelect（radio button 转 select）
            const portraitBtn = document.getElementById('orientPortraitBtn');
            const landscapeBtn = document.getElementById('orientLandscapeBtn');
            const paperLabel = document.getElementById('previewPaperLabel');

            function getCurrentPaperSize() {
                const sel = document.getElementById('paperSize');
                return sel ? sel.value : 'A4';
            }

            function updatePreviewPaperLabel() {
                const ps = getCurrentPaperSize();
                const opt = document.querySelector(`#paperSize option[value="${ps}"]`);
                if (paperLabel && opt) paperLabel.textContent = opt.textContent;
            }

            // 同步方向按钮高亮与打印设置中的单选按钮
            function syncOrientButtons() {
                const checked = document.querySelector('input[name="orientation"]:checked');
                const isLandscape = checked && checked.value === 'landscape';
                if (portraitBtn && landscapeBtn) {
                    portraitBtn.classList.toggle('bg-blue-500', !isLandscape);
                    portraitBtn.classList.toggle('text-white', !isLandscape);
                    landscapeBtn.classList.toggle('bg-blue-500', !!isLandscape);
                    landscapeBtn.classList.toggle('text-white', !!isLandscape);
                }
            }

            // 把方向按钮映射成 PrintPreview 期望的 select
            const orientSelectShim = {
                get value() {
                    const c = document.querySelector('input[name="orientation"]:checked');
                    return c ? c.value : 'portrait';
                },
                addEventListener() { /* PrintPreview 自己监听 radio */ },
            };

            if (portraitBtn) {
                portraitBtn.addEventListener('click', () => {
                    const radio = document.querySelector('input[name="orientation"][value="portrait"]');
                    if (radio) { radio.checked = true; radio.dispatchEvent(new Event('change', { bubbles: true })); }
                    syncOrientButtons();
                    window.__printPreview && window.__printPreview.updatePaperStyle();
                });
            }
            if (landscapeBtn) {
                landscapeBtn.addEventListener('click', () => {
                    const radio = document.querySelector('input[name="orientation"][value="landscape"]');
                    if (radio) { radio.checked = true; radio.dispatchEvent(new Event('change', { bubbles: true })); }
                    syncOrientButtons();
                    window.__printPreview && window.__printPreview.updatePaperStyle();
                });
            }

            // 初始化 PrintPreview
            try {
                const pp = new PrintPreview({
                    containerId: 'printPreviewContainer',
                    fileInput: fileInput,
                    paperSelect: document.getElementById('paperSize'),
                    orientSelect: orientSelectShim,
                });
                pp.init();
                window.__printPreview = pp;
                updatePreviewPaperLabel();
                syncOrientButtons();
                console.log('✅ 实时打印预览已启用');
            } catch (e) {
                console.error('❌ 实时打印预览初始化失败：', e);
            }

            // ===== fnOS 文件管理器"右键打开"自动加载 =====
            // fnOS 在用户右键 → "用 Web 打印服务打印" 时，会带上 ?path=/vol1/.../file.xxx 跳到本页
            (async () => {
                try {
                    const urlParams = new URLSearchParams(window.location.search);
                    const openPath = urlParams.get('path');
                    if (!openPath) return;

                    console.log('📂 fnOS 路径打开：', openPath);
                    showToast(`正在加载 ${decodeURIComponent(openPath).split('/').pop()}...`, 'info');

                    const resp = await fetch(`/api/open-from-path?path=${encodeURIComponent(openPath)}`);
                    const data = await resp.json();

                    if (!resp.ok || !data.success) {
                        showToast('加载失败: ' + (data.error || `HTTP ${resp.status}`), 'error');
                        return;
                    }

                    // 复用上传成功后的 UI 更新流程
                    uploadedFile = data;
                    updatePrintButton();

                    if (data.original_filename) {
                        showSelectedFileInfo(data.filename, formatFileSize(data.size), []);
                    }

                    // 触发实时预览（PDF.js 加载文件并生成预览图）
                    if (window.__printPreview && data.filename) {
                        await window.__printPreview.handleFileByName(data.filename);
                    }

                    // 清理 URL 中的 path 参数（避免刷新时重复加载）
                    if (window.history && window.history.replaceState) {
                        const cleanUrl = window.location.pathname + window.location.hash;
                        window.history.replaceState({}, '', cleanUrl);
                    }

                    showToast('文件已加载，可以打印', 'success');
                } catch (e) {
                    console.error('打开路径失败:', e);
                    showToast('打开失败: ' + e.message, 'error');
                }
            })();

            // 监听纸张/方向变化以更新预览与标签
            const paperSizeEl = document.getElementById('paperSize');
            if (paperSizeEl) {
                paperSizeEl.addEventListener('change', () => {
                    updatePreviewPaperLabel();
                    window.__printPreview && window.__printPreview.updatePaperStyle();
                });
            }
            document.querySelectorAll('input[name="orientation"]').forEach(r => {
                r.addEventListener('change', () => {
                    syncOrientButtons();
                    window.__printPreview && window.__printPreview.updatePaperStyle();
                });
            });

            // 添加错误处理的定时器
            jobsTimerId = setInterval(() => {
                try {
                    loadJobs();
                } catch (e) {
                    console.error('定时加载任务失败:', e);
                }
            }, 3000);

            filesTimerId = setInterval(() => {
                try {
                    loadFiles();
                } catch (e) {
                    console.error('定时加载文件失败:', e);
                }
            }, 8000);

            // 页面卸载时清理定时器
            window.addEventListener('beforeunload', () => {
                clearInterval(jobsTimerId);
                clearInterval(filesTimerId);
                clearInterval(printerInfoTimerId);
                if (window.__printPreview) window.__printPreview.destroy();
            });

            // 定时刷新打印机信息（队列、墨盒、打印机信息）- 每 5 秒
            // 注意：定时器在 resetPrinterInfoTimer() 中统一管理
        });


        function resetUploadUI() {
            const uploadProgress = document.getElementById('uploadProgress');
            const uploadState = document.getElementById('uploadState');
            const selectedFileInfo = document.getElementById('selectedFileInfo');
            const removeFileBtn = document.getElementById('removeFile');
            if (uploadProgress) uploadProgress.style.display = 'none';
            if (uploadState) uploadState.classList.remove('hidden');
            if (selectedFileInfo) {
                selectedFileInfo.classList.add('hidden');
                selectedFileInfo.classList.remove('flex', 'flex-col');
            }
            if (removeFileBtn) removeFileBtn.classList.add('hidden');
        }

        async function handleFile(file) {
            if (currentUploadXhr) {
                currentUploadXhr.abort();
                currentUploadXhr = null;
            }

            const ext = file.name.split('.').pop().toLowerCase();
            if (!ALLOWED_EXTENSIONS.includes(ext)) {
                showToast(`不支持的文件格式 .${ext}，支持：${ALLOWED_EXTENSIONS.join(', ')}`, 'error');
                return;
            }
            if (file.size > UPLOAD_LIMIT) {
                showToast(`文件过大（限制 ${UPLOAD_LIMIT / 1024 / 1024}MB），当前 ${(file.size / 1024 / 1024).toFixed(1)}MB`, 'error');
                return;
            }

            const formData = new FormData();
            const uploadToken = 'up_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            formData.append('file', file);
            formData.append('upload_token', uploadToken);

            const uploadState = document.getElementById('uploadState');
            const selectedFileInfo = document.getElementById('selectedFileInfo');
            const uploadProgress = document.getElementById('uploadProgress');
            if (uploadState) uploadState.classList.add('hidden');
            if (selectedFileInfo) {
                selectedFileInfo.classList.add('hidden');
                selectedFileInfo.classList.remove('flex', 'flex-col');
            }
            if (uploadProgress) {
                uploadProgress.style.display = 'flex';
                const bar = document.getElementById('progressBar');
                const text = document.getElementById('progressText');
                const pct = document.getElementById('progressPercent');
                if (bar) { bar.style.width = '0%'; bar.classList.remove('bg-green-500'); bar.classList.add('bg-blue-500'); }
                if (text) text.textContent = '正在上传...';
                if (pct) pct.textContent = '0%';
            }

            document.getElementById('cancelUploadBtn').onclick = function() {
                if (currentUploadXhr) {
                    currentUploadXhr.abort();
                    currentUploadXhr = null;
                }
                fetch('/api/upload-cancel/' + uploadToken, {method: 'DELETE'}).catch(function() {});
                resetUploadUI();
                showToast('上传已取消', 'info');
            };

            try {
                const data = await new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    currentUploadXhr = xhr;
                    xhr.timeout = 180000;

                    xhr.upload.onprogress = (e) => {
                        if (e.lengthComputable) {
                            const pct = Math.round((e.loaded / e.total) * 100);
                            const bar = document.getElementById('progressBar');
                            const pctEl = document.getElementById('progressPercent');
                            if (bar) bar.style.width = pct + '%';
                            if (pctEl) pctEl.textContent = pct + '%';
                            if (pct >= 100) {
                                const text = document.getElementById('progressText');
                                if (text) text.textContent = '正在处理文件...';
                            }
                        }
                    };

                    xhr.onload = function() {
                        currentUploadXhr = null;
                        try {
                            if (xhr.status >= 200 && xhr.status < 300) {
                                resolve(JSON.parse(xhr.responseText));
                            } else {
                                try {
                                    const errData = JSON.parse(xhr.responseText);
                                    reject(new Error(errData.error || '上传失败'));
                                } catch (e) {
                                    reject(new Error('上传失败 (HTTP ' + xhr.status + ')'));
                                }
                            }
                        } catch (e) {
                            reject(new Error('服务器响应异常'));
                        }
                    };

                    xhr.onerror = function() {
                        currentUploadXhr = null;
                        reject(new Error('网络错误'));
                    };

                    xhr.onabort = function() {
                        reject(new Error('_ABORTED_'));
                    };

                    xhr.ontimeout = function() {
                        currentUploadXhr = null;
                        reject(new Error('上传超时，请检查网络连接或文件大小后重试'));
                    };

                    try {
                        xhr.open('POST', '/api/upload');
                        xhr.send(formData);
                    } catch (e) {
                        reject(e);
                    }
                });

                if (data.success) {
                    uploadedFile = data;

                    const uploadProgress = document.getElementById('uploadProgress');
                    if (uploadProgress) uploadProgress.style.display = 'none';
                    updatePrintButton();
                    showSelectedFileInfo(data.filename, formatFileSize(file.size), data.preview_images || []);

                    if (data.warning) {
                        showToast('上传成功：' + data.warning, 'warning');
                    } else {
                        showToast('文件上传成功', 'success');
                    }

                    // 复用预生成的 PDF（previews/<name>.pdf），驱动右侧实时预览
                    if (window.__printPreview) {
                        window.__printPreview.handleFileByName(data.filename);
                    }
                } else {
                    resetUploadUI();
                    showToast('上传失败: ' + (data.error || '未知错误'), 'error');
                }
            } catch (error) {
                if (error.message === '_ABORTED_') return;
                resetUploadUI();
                showToast('上传失败: ' + error.message, 'error');
            }
        }

        // 存储当前文件的预览图片信息
        // ============================================================
        // 已选文件信息条（详细预览交给右侧「实时打印预览」）
        // ============================================================

        // 根据扩展名返回合适的图标 SVG
        function fileTypeIconSvg(ext) {
            const pdfIcon = '<svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/><path stroke-linecap="round" stroke-linejoin="round" d="M13 3v4a2 2 0 002 2h4"/></svg>';
            const imgIcon = '<svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>';
            const docIcon = '<svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>';

        async function handlePrint() {
            const btn = document.getElementById('printBtn');
            if (!btn) return;

            if (!uploadedFile) {
                showToast('请先上传文件', 'error');
                return;
            }

            const printerName = document.getElementById('printerSelect').value;
            if (!printerName) {
                showToast('请选择打印机', 'error');
                return;
            }

            // 获取打印设置
            const colorMode = document.querySelector('input[name="colorMode"]:checked');
            const duplex = document.querySelector('input[name="duplex"]:checked');
            const orientation = document.querySelector('input[name="orientation"]:checked');
            const paperSize = document.getElementById('paperSize');
            const paperType = document.getElementById('paperType');
            const copies = document.getElementById('copies');
            const pageRange = document.getElementById('pageRange');
            const mirrorPrint = document.getElementById('mirrorPrint');
            const printScaling = document.getElementById('printScaling');

            if (!colorMode) {
                console.error('未选择色彩模式');
                showToast('请选择色彩模式', 'error');
                return;
            }
            
            // 验证页面范围格式
            if (pageRange && pageRange.value.trim() !== '') {
                if (!validatePageRange(pageRange.value.trim())) {
                    showToast('页面范围格式无效，请使用空格分隔（如：1-5 8 10-12）', 'error');
                    return;
                }
            }

            btn.disabled = true;
            btn.textContent = '提交中...';

            try {
                const response = await fetch('/api/print', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        filename: uploadedFile.filename,
                        printer: printerName,
                        color_mode: colorMode.value,
                        duplex: duplex ? duplex.value : 'one-sided',
                        orientation: orientation ? orientation.value : 'portrait',
                        paper_size: paperSize ? paperSize.value : 'A4',
                        paper_type: paperType ? paperType.value : 'plain',
                        copies: parseInt(copies.value) || 1,
                        page_range: pageRange ? pageRange.value.trim() : null,
                        mirror: mirrorPrint ? mirrorPrint.checked : false,
                        print_scaling: printScaling ? printScaling.value : 'fit'
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showToast('打印任务提交成功', 'success');
                    // 显示打印参数详情
                    if (data.job) {
                        showPrintParams(data.job);
                    }
                    // 显示 IPP 队列推荐提示（如果当前用的是 cnijbe2 等私有协议）
                    if (data.recommendation) {
                        showToast(data.recommendation.message, 'warning', 8000);
                    }
                    loadJobs();
                    resetForm();
                } else {
                    showToast('提交失败: ' + data.error, 'error');
                }
            } catch (error) {
                console.error('打印错误:', error);
                showToast('提交失败: ' + error.message, 'error');
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 9V3h12v6M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v7H6z"/></svg> 提交打印';
                }
            }
        }

        async function loadPrinters() {
            console.log('开始加载打印机列表...');
            try {
                // 第一步：快速加载打印机列表（异步模式，不等待探测）
                const response = await fetch('/api/printers?async=true');

                if (!response.ok) {
                    throw new Error(`HTTP 错误：${response.status}`);
                }

                const data = await response.json();
                console.log('打印机 API 响应:', data);
                
                const select = document.getElementById('printerSelect');
                if (!select) {
                    console.error('找不到打印机选择器元素');
                    return;
                }

                select.innerHTML = '';

                if (data.printers && data.printers.length > 0) {
                    // 先显示打印机列表（状态显示"检测中..."）
                    data.printers.forEach(printer => {
                        const option = document.createElement('option');
                        option.value = printer.name;
                        // ipp-usb 队列标记为推荐
                        const isIpp = printer.uri && (printer.uri.startsWith('ipp://') || printer.uri.startsWith('ipps://') || printer.uri.startsWith('dnssd://'));
                        option.textContent = isIpp
                            ? `${printer.name} [IPP] (检测中...)`
                            : `${printer.name} (检测中...)`;
                        if (isIpp) {
                            option.setAttribute('data-preferred', '1');
                        }
                        select.appendChild(option);
                    });

                    // 优先选择 IPP 队列，cnijbe2 等私有协议队列作为 fallback
                    const preferredIdx = Array.from(select.options).findIndex(o => o.getAttribute('data-preferred') === '1');
                    select.selectedIndex = preferredIdx >= 0 ? preferredIdx : 0;
                    console.log(`成功加载 ${data.printers.length} 台打印机，默认选中：${select.options[select.selectedIndex].text}，开始并发探测状态...`);

                    // 第二步：并发请求每台打印机的在线状态，独立更新（不等待其他打印机）
                    data.printers.forEach((printer, index) => {
                        // 为每台打印机发起独立的异步请求
                        (async () => {
                            try {
                                console.log(`正在探测打印机：${printer.name}`);
                                const statusResp = await fetch(`/api/printer/${encodeURIComponent(printer.name)}/status`);
                                let result;
                                if (statusResp.ok) {
                                    result = await statusResp.json();
                                    console.log(`打印机 ${printer.name} 状态响应:`, result);
                                } else {
                                    console.warn(`打印机 ${printer.name} 状态 HTTP 错误：${statusResp.status}`);
                                    result = { name: printer.name, online_status: 'unknown', status: '未知' };
                                }

                                // 立即更新这一台打印机的显示
                                const option = select.options[index];
                                if (option) {
                                    let statusDisplay = result.status || '未知';
                                    if (result.online_status === 'online') {
                                        statusDisplay = '在线';
                                    } else if (result.online_status === 'offline') {
                                        statusDisplay = '离线';
                                    }
                                    option.textContent = `${result.name} (${statusDisplay})`;
                                    console.log(`打印机 ${result.name} 状态更新：${statusDisplay}`);
                                }
                            } catch (e) {
                                // 失败也立即更新为未知
                                const option = select.options[index];
                                if (option) {
                                    option.textContent = `${printer.name} (未知)`;
                                }
                                console.warn(`获取打印机 ${printer.name} 状态失败:`, e);
                            }
                        })();
                    });

                    console.log(`已发起 ${data.printers.length} 台打印机的状态探测（异步独立更新）`);

                    // 更新打印机信息显示
                    updatePrinterInfoDisplay();
                } else {
                    const option = document.createElement('option');
                    option.value = '';
                    option.textContent = '未检测到打印机';
                    select.appendChild(option);
                    console.log('未检测到可用打印机');
                }
                updatePrintButton();
            } catch (error) {
                console.error('加载打印机失败:', error);
                // 即使出错，也要更新 UI
                const select = document.getElementById('printerSelect');
                if (select) {
                    select.innerHTML = '';
                    const option = document.createElement('option');
                    option.value = '';
                    option.textContent = `加载失败：${error.message}`;
                    select.appendChild(option);
                }
                showToast('加载打印机列表失败，请检查网络连接', 'error');
            }
            console.log('打印机列表加载完成');
        }

        // 更新打印机信息显示（队列、墨盒）- 调用 API 获取最新数据
        // 使用全局变量存储时间戳（避免闭包作用域问题）
        window.lastPrinterInfoRequestTimestamp = 0;

        async function updatePrinterInfoDisplay() {
            const printerSelect = document.getElementById('printerSelect');
            if (!printerSelect) {
                console.error('updatePrinterInfoDisplay: 找不到打印机选择器元素');
                return;
            }

            const selectedPrinter = printerSelect.value;
            if (!selectedPrinter) {
                console.log('updatePrinterInfoDisplay: 未选择打印机');
                return;
            }

            console.log(`updatePrinterInfoDisplay: 开始加载打印机 [${selectedPrinter}] 信息...`);

            // 记录当前请求时间戳
            const requestTimestamp = Date.now();
            window.lastPrinterInfoRequestTimestamp = requestTimestamp;

            try {
                // 只获取当前选中打印机的详细信息
                console.log(`updatePrinterInfoDisplay: 请求 /api/printer/${encodeURIComponent(selectedPrinter)}`);
                const response = await fetch(`/api/printer/${encodeURIComponent(selectedPrinter)}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const printer = await response.json();
                console.log(`updatePrinterInfoDisplay: 收到打印机数据:`, printer);

                // 检查是否有更新的请求，如果有则跳过渲染（避免旧请求覆盖新数据）
                if (window.lastPrinterInfoRequestTimestamp !== requestTimestamp) {
                    console.log('检测到更新的请求，跳过旧数据渲染');
                    return;
                }

                // 更新队列显示（使用公共渲染函数）
                const printerQueueInfo = document.getElementById('printerQueueInfo');
                if (printerQueueInfo) {
                    const queue = printer.queue || [];
                    const status = printer.status || 'unknown';
                    printerQueueInfo.innerHTML = renderQueueHtml(queue, status);
                }

                // 更新墨盒显示
            const printerInkInfo = document.getElementById('printerInkInfo');
            if (printerInkInfo) {
                const cartridges = printer.ink_cartridges || [];
                if (cartridges && cartridges.length > 0) {
                    const cartridgesHtml = cartridges.map(cartridge => {
                        let colorHex = '';
                        let colorName = cartridge.display_name || cartridge.name || '未知';
                        // 完整名称用于 tooltip
                        let colorFullName = cartridge.full_display_name || cartridge.name || colorName;
                        let level = cartridge.level;
                        let status;
                        const isWasteInk = cartridge.type === 'waste-ink' || (cartridge.name && ['废墨', 'Waste'].some(k => cartridge.name.includes(k)));

                        // 处理 IPP 特殊状态值 (-1, -2, -3)
                        let levelText = '';
                        let showProgress = true;

                        if (cartridge.level_status) {
                            switch (cartridge.level_status) {
                                case 'unknown':
                                    // IPP 返回 -1 或 -2 但实际装着墨盒
                                    // 根据 has_cartridge 字段区分友好提示
                                    if (cartridge.has_cartridge === false) {
                                        levelText = '未安装';
                                    } else {
                                        levelText = '余量不可读';
                                    }
                                    showProgress = false;
                                    break;
                                case 'not_installed':
                                    levelText = '未安装';
                                    showProgress = false;
                                    break;
                                case 'not_applicable':
                                    levelText = '不适用';
                                    showProgress = false;
                                    break;
                                case 'estimated':
                                    // 估算值：显示百分比 + "估算"标识
                                    levelText = `~${level}%`;
                                    showProgress = true;
                                    break;
                                default:
                                    levelText = `${level}%`;
                            }
                        } else if (level === null || level < 0) {
                            levelText = '余量不可读';
                            showProgress = false;
                        } else {
                            levelText = `${level}%`;
                        }

                        if (cartridge.color && cartridge.color.startsWith('#')) {
                            // 只允许合法的十六进制颜色，防止属性注入
                            colorHex = /^#[0-9a-fA-F]{3,8}$/.test(cartridge.color) ? cartridge.color : '#6b7280';
                            if (level === null) {
                                status = '未知';
                            } else if (isWasteInk) {
                                status = level >= 80 ? '警告' : '正常';
                            } else {
                                status = level > 20 ? '正常' : (level > 0 ? '警告' : '空');
                            }
                        } else {
                            switch(cartridge.color) {
                                case 'black': colorHex = '#1f2937'; break;
                                case 'cyan': colorHex = '#06b6d4'; break;
                                case 'magenta': colorHex = '#ec4899'; break;
                                case 'yellow': colorHex = '#eab308'; break;
                                case 'color': colorHex = 'linear-gradient(90deg, #06b6d4, #ec4899, #eab308)'; break;
                                default: colorHex = '#6b7280';
                            }
                            colorName = cartridge.color_name || cartridge.color || '未知';
                            status = cartridge.status || '正常';
                        }

                        let progressColor = 'bg-green-500';
                        if (showProgress) {
                            if (isWasteInk) {
                                if (level >= 80) progressColor = 'bg-red-500';
                                else if (level >= 50) progressColor = 'bg-yellow-500';
                            } else {
                                if (level < 20) progressColor = 'bg-red-500';
                                else if (level < 50) progressColor = 'bg-yellow-500';
                            }
                        } else {
                            progressColor = 'bg-gray-300';
                        }

                        let statusIcon = '';
                        let statusClass = 'text-gray-600';
                        if (!showProgress) {
                            statusIcon = '<svg class="w-3 h-3 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>';
                            statusClass = 'text-gray-500';
                        } else if (status === '正常' || status === 'Normal' || status === 'OK') {
                            statusIcon = '<svg class="w-3 h-3 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>';
                            statusClass = 'text-green-600';
                        } else if (status === '警告' || status === 'Warning') {

                            statusClass = 'text-yellow-600';

        async function loadFiles() {
            console.log('加载文件列表');
            try {
                const response = await fetch('/api/files');
                const data = await response.json();
                const container = document.getElementById('filesList');
                if (!container) return;

                if (!data.files || data.files.length === 0) {
                    container.innerHTML = '<p class="text-gray-500 text-sm text-center py-4">暂无已上传文件</p>';
                    return;
                }

                container.innerHTML = data.files.map(file => `
                    <div class="flex gap-3 p-3 bg-gray-50 rounded">
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-medium text-gray-800 break-all">${escapeHtml(file.filename)}</p>
                            <p class="text-xs text-gray-500 mt-1">${formatFileSize(file.size)}</p>
                        </div>
                        <div class="flex flex-col gap-1 flex-shrink-0">
                            <button data-action="select" data-filename="${encodeURIComponent(file.filename)}" class="text-xs bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded transition whitespace-nowrap">选择</button>
                            <button data-action="delete" data-filename="${encodeURIComponent(file.filename)}" class="text-xs bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded transition whitespace-nowrap">删除</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('加载文件列表失败:', error);
            }
        }

        async function selectFile(filename) {
            try {
                const response = await fetch('/api/files');
                const data = await response.json();
                const file = data.files.find(f => f.filename === filename);
                if (file) {
                    uploadedFile = { filename: file.filename, size: file.size };

                    // 更新左侧"已选文件"信息条
                    showSelectedFileInfo(file.filename, formatFileSize(file.size), file.preview_images || []);

                    // Pass preview images if available
                    const previewImages = file.preview_images || [];

                    // 判断是否有真实可预览资源：
                    //   - 文档/PDF：需要 preview_images 非空（说明转换成功）
                    //   - 图片：v3.0.8 起走 <img> 直显，不再生成 PNG 缩略图，
                    //           preview_images 为空是正常的，不应误报"预览不存在"
                    if (file.type === 'document' || file.type === 'pdf') {
                        if (previewImages.length === 0) {
                            showToast('已选择文件，但预览文件不存在，请重新上传', 'warning');
                        } else {
                            showToast('已选择文件', 'success');
                        }
                    } else {
                        // 图片（以及未来其它直显类型）一律视为可用预览
                        showToast('已选择文件', 'success');
                    }

                    // 驱动右侧的实时 PDF.js 预览
                    // 用 handleFileByName 复用 previews 里已转换的 PDF（不重新走 libreoffice 转换）
                    if (window.__printPreview) {
                        window.__printPreview.handleFileByName(file.filename);
                    }
                    updatePrintButton();
                }
            } catch (error) {
                console.error('选择文件失败:', error);
            }
        }

        async function deleteFile(filename) {
            if (!confirm(`确定要删除文件 "${filename}" 吗？`)) {
                return;
            }

            try {
                const response = await fetch(`/api/files/${encodeURIComponent(filename)}`, {
                    method: 'DELETE'
                });
                const data = await response.json();

                if (data.success) {
                    showToast('文件删除成功', 'success');
                    loadFiles();
                } else {
                    showToast('删除失败: ' + data.error, 'error');
                }
            } catch (error) {
                console.error('删除文件失败:', error);
                showToast('删除失败: ' + error.message, 'error');
            }
        }

                                    <span class="text-gray-800">${job.copies}</span>
                                </div>
                                <div class="flex">
                                    <span class="text-gray-500 w-20">镜像打印:</span>
                                    <span class="text-gray-800">${job.mirror ? '是' : '否'}</span>
                                </div>
                                <div class="flex">
                                    <span class="text-gray-500 w-20">打印缩放:</span>
<span class="text-gray-800">${escapeHtml(getPrintScalingText(job.print_scaling))}</span>
                                </div>
                                ${job.page_range ? `
                                <div class="flex">
                                    <span class="text-gray-500 w-20">页面范围:</span>
                                    <span class="text-gray-800">${escapeHtml(job.page_range)}</span>
                                </div>
                                ` : ''}
                            </div>
                            <div class="mt-2 text-xs text-gray-400">
                                任务ID: ${job.id.substring(0, 8)}...
                                ${job.cups_job_id ? ` | CUPS任务ID: ${escapeHtml(job.cups_job_id)}` : ''}
                            </div>
                            ${job.message ? `
                            <div class="mt-2 p-2 bg-gray-50 rounded text-xs text-gray-600">
                                <span class="font-medium">消息:</span> ${escapeHtml(job.message)}
                            </div>
                            ` : ''}
                            ${job.printer_errors && job.printer_errors.has_error ? renderPrinterErrorCard(job.printer_errors) : ''}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('加载任务列表失败:', error);
            }
        }

        function getStatusColor(status) {
            const colors = {
                'submitted': 'bg-blue-100 text-blue-800',
                'queued': 'bg-purple-100 text-purple-800',
                'processing': 'bg-yellow-100 text-yellow-800',
                'completed': 'bg-green-100 text-green-800',
                'failed': 'bg-red-100 text-red-800',
                'timeout': 'bg-orange-100 text-orange-800',
                'cancelled': 'bg-gray-100 text-gray-800',
                'unknown': 'bg-gray-200 text-gray-800'
            };
            return colors[status] || 'bg-gray-100 text-gray-800';
        }

        function getProgressColor(progress) {
            if (progress >= 100) return 'bg-green-500';
            if (progress >= 80) return 'bg-blue-500';
            if (progress >= 50) return 'bg-yellow-500';
            return 'bg-red-500';
        }

        function getStatusText(status) {
            const texts = {
                'submitted': '已提交',
                'queued': '排队中',
                'processing': '处理中',
                'completed': '已完成',
                'failed': '失败',
                'timeout': '超时',
                'cancelled': '已取消',
                'unknown': '状态未知'
            };
            return texts[status] || status;
        }

        // 判断任务是否可以取消
        function canCancelJob(status) {
            // 只有已提交和处理中的任务可以取消
            return status === 'submitted' || status === 'queued' || status === 'processing';
        }

        // 判断任务是否可以删除
        function canDeleteJob(status) {
            // 已完成、失败、超时和状态未知的任务可以删除
            return status === 'completed' || status === 'failed' || status === 'timeout' || status === 'unknown' || status === 'error';
        }

        // 工具栏显示/隐藏：有任务时显示
        function updateJobsToolbar() {
            const toolbar = document.getElementById('jobsToolbar');
            if (!toolbar) return;
            const hasJobs = jobs && jobs.length > 0;
            const hasCancellable = jobs && jobs.some(j => canCancelJob(j.status));
            const hasDeletable = jobs && jobs.some(j => canDeleteJob(j.status));
            toolbar.classList.toggle('hidden', !hasJobs);
            const cancelAllBtn = document.getElementById('cancelAllJobsBtn');
            const deleteAllBtn = document.getElementById('deleteAllJobsBtn');
            if (cancelAllBtn) cancelAllBtn.classList.toggle('hidden', !hasCancellable);
            if (deleteAllBtn) deleteAllBtn.classList.toggle('hidden', !hasDeletable);
        }

        // 全部取消
        async function cancelAllJobs() {
            const cancellable = (jobs || []).filter(j => canCancelJob(j.status));
            if (cancellable.length === 0) {
                showToast('没有可取消的任务', 'info');
                return;
            }
            if (!confirm(`确定要取消全部 ${cancellable.length} 个任务吗？\n\n取消后任务将在 5 秒后自动从列表删除。`)) {
                return;
            }
            showToast(`正在取消 ${cancellable.length} 个任务...`, 'info');
            const results = await Promise.allSettled(cancellable.map(job =>
                fetch(`/api/jobs/${job.id}`, { method: 'DELETE' })
                    .then(r => r.json())
                    .then(d => ({ id: job.id, ok: d.success, err: d.error }))
                    .catch(e => ({ id: job.id, ok: false, err: e.message }))
            ));
            const ok = results.filter(r => r.status === 'fulfilled' && r.value.ok).length;
            const fail = results.length - ok;
            if (fail === 0) {
                showToast(`已取消 ${ok} 个任务，5 秒后自动删除`, 'success');
            } else {
                showToast(`取消完成：成功 ${ok}，失败 ${fail}`, 'error');
            }
            setTimeout(async () => { await loadJobs(); }, 5500);
        }

        // 全部删除
        async function deleteAllJobs() {
            const deletable = (jobs || []).filter(j => canDeleteJob(j.status));
            if (deletable.length === 0) {
                showToast('没有可删除的任务记录', 'info');
                return;
            }
            if (!confirm(`确定要删除全部 ${deletable.length} 个任务记录吗？\n\n此操作仅删除任务记录，不会影响已打印的文件。`)) {
                return;
            }
            showToast(`正在删除 ${deletable.length} 个记录...`, 'info');
            const results = await Promise.allSettled(deletable.map(job =>
                fetch(`/api/jobs/${job.id}`, { method: 'DELETE' })
                    .then(r => r.json())
                    .then(d => ({ id: job.id, ok: d.success, err: d.error }))
                    .catch(e => ({ id: job.id, ok: false, err: e.message }))
            ));
            const ok = results.filter(r => r.status === 'fulfilled' && r.value.ok).length;
            const fail = results.length - ok;
            showToast(`删除完成：成功 ${ok}，失败 ${fail}`, fail === 0 ? 'success' : 'error');
            await loadJobs();
        }

        // 取消任务
        async function cancelJob(jobId, event) {
            // 阻止事件冒泡，防止触发任务详情展开
            if (event) {
                event.stopPropagation();
            }

            // 获取任务信息用于确认对话框
            const job = jobs.find(j => j.id === jobId);
            if (!job) {
                showToast('任务不存在', 'error');
                return;
            }

            // 二次确认
            if (!confirm(`确定要取消打印任务吗？\n\n文件：${job.filename}\n打印机：${job.printer}\n\n注意：取消后任务将在 5 秒后自动从列表删除。`)) {
                return;
            }

            try {
                const response = await fetch(`/api/jobs/${jobId}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (data.success) {
                    showToast('任务已取消，5 秒后自动删除', 'success');
                    // 5 秒后自动刷新任务列表
                    setTimeout(async () => {
                        await loadJobs();
                    }, 5500);
                } else {
                    showToast('取消失败：' + data.error, 'error');
                }
            } catch (error) {
                console.error('取消任务失败:', error);
                showToast('取消失败：' + error.message, 'error');
            }
        }

        // 删除任务
        async function deleteJob(jobId, event) {
            // 阻止事件冒泡，防止触发任务详情展开
            if (event) {
                event.stopPropagation();
            }

            // 获取任务信息用于确认对话框
            const job = jobs.find(j => j.id === jobId);
            if (!job) {
                showToast('任务不存在', 'error');
                return;
            }

            // 二次确认
            if (!confirm(`确定要删除此任务记录吗？\n\n文件：${job.filename}\n状态：${getStatusText(job.status)}\n\n注意：此操作仅删除任务记录，不会影响已打印的文件。`)) {
                return;
            }

            try {
                const response = await fetch(`/api/jobs/${jobId}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (data.success) {
                    showToast('任务已删除', 'success');
                    // 立即刷新任务列表
                    await loadJobs();
                } else {
                    showToast('删除失败：' + data.error, 'error');
                }
            } catch (error) {
                console.error('删除任务失败:', error);
                showToast('删除失败：' + error.message, 'error');
            }
        }

        function getColorModeText(mode) {
            const texts = {
                'color': '彩色',
                'mono': '黑白'

            return texts[mode] || mode;
        }

        function getDuplexText(duplex) {
            const texts = {
                'one-sided': '单面打印',

            return texts[duplex] || duplex;
        }

        function getOrientationText(orientation) {
            const texts = {
                'portrait': '纵向',
                'landscape': '横向'

        }

        function getPaperSizeText(size) {
